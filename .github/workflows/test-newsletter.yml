# Prueba manual del boletín. No despliega nada y no corre solo:
# se dispara a mano desde la pestaña Actions.
name: Probar boletín

on:
  workflow_dispatch:
    inputs:
      post_path:
        description: 'Post a probar: ruta, nombre de archivo o URL del artículo. Vacío = el más reciente.'
        required: false
        default: ''
        type: string
      mode:
        description: 'dry_run imprime el correo sin tocar la API; draft lo crea en Buttondown para revisarlo'
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - draft

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Resolve the post
        id: resolve
        env:
          POST_INPUT: ${{ inputs.post_path }}
        run: python3 .github/scripts/resolve_post.py

      - name: Run notifier
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SITE_URL: https://surcomun.com
          SEND_MODE: draft
          DRY_RUN: ${{ inputs.mode == 'dry_run' && '1' || '' }}
          POST_PATH: ${{ steps.resolve.outputs.path }}
        run: echo "$POST_PATH" | python3 .github/scripts/notify_subscribers.py
