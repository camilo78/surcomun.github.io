# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Aviso a la lista de correo: corre solo después de un deploy exitoso,
  # para que el enlace del boletín ya resuelva cuando sale el correo.
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Detect newly added posts
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Push inicial o forzado: sin base de comparación, no se avisa nada."
            : > new_posts.txt
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "El commit anterior no está disponible; no se avisa nada."
            : > new_posts.txt
          else
            git diff --diff-filter=A --name-only "$BEFORE" "$AFTER" -- '_posts/*.md' > new_posts.txt
          fi
          echo "Posts nuevos detectados:"
          cat new_posts.txt

      - name: Notify subscribers
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SITE_URL: https://surcomun.com
          # Cambiá a 'about_to_send' cuando quieras que salga sin revisión previa.
          SEND_MODE: ${{ vars.BUTTONDOWN_SEND_MODE || 'draft' }}
        run: python3 .github/scripts/notify_subscribers.py < new_posts.txt
